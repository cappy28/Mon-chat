name: Applis exe + apk
on: workflow_dispatch
permissions: { contents: write }
env: { VITE_ROOM_PASSWORD: "${{ secrets.ROOM_PASSWORD }}" }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          npm install
          npx tauri init --ci -A MonChat -W MonChat -D ../dist -P http://localhost:5173 --before-dev-command "npm run dev" --before-build-command "npm run build"
          npx tauri build --config '{"identifier":"com.monchat.app"}'
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: src-tauri/target/release/bundle/nsis/*.exe }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - env: { KS_PW: "${{ secrets.KEYSTORE_PASSWORD }}" }
        run: |
          npm install && npm run build
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          cd android && ./gradlew assembleRelease
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../monchat.keystore --ks-pass env:KS_PW --out ../MonChat.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: MonChat.apk }

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Bêta n°${{ github.run_number }}
          files: out/*
          
